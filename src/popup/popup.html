<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>划词翻译</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <strong>划词翻译</strong>
    <button id="options" type="button">设置</button>
  </header>
  <label class="check">
    <input id="enabled" type="checkbox">
    <span>启用划词翻译</span>
  </label>
  <label>目标语言
    <select id="target"></select>
  </label>
  <label>引擎
    <select id="engine">
      <option value="bing">Bing 翻译</option>
      <option value="google">Google 翻译</option>
      <option value="mymemory">MyMemory</option>
      <option value="deepl">DeepL</option>
      <option value="openai">OpenAI 兼容</option>
      <option value="libretranslate">LibreTranslate</option>
      <option value="azure">Azure 翻译</option>
    </select>
  </label>
  <button id="blacklist" type="button" class="wide">读取当前网站…</button>
  <ul id="recent"></ul>
  <p class="keys"><kbd>Alt</kbd>+<kbd>T</kbd> 强制翻译 · <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>T</kbd> 开关</p>
  <script src="../lib/constants.js"></script>
  <script src="../lib/languages.js"></script>
  <script src="../lib/settings.js"></script>
  <script src="../lib/history.js"></script>
  <script src="popup.js"></script>
</body>
</html>
